name: Release docs

on:
  # Runs when manually triggered from the GitHub UI.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to build the docs from. If empty, the triggering ref is used.
        required: false
        type: string
        default: ""

  # Runs when invoked by another workflow.
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or ref to build the docs from. If empty, the triggering ref is used.
        required: false
        type: string
        default: ""
      skip_checks:
        description: Skip the release branch and `Checks` gate for the built commit. The calling workflows run their own gate.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PYTHON_VERSION: 3.14

jobs:
  build_docs:
    name: Build docs
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record the built commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A manual dispatch builds only a commit that is on a release branch and passed the `Checks` workflow (run by
      # `on_master.yaml`). Calling workflows skip both steps through `skip_checks`.
      - name: Check that the commit is on a release branch
        if: ${{ !inputs.skip_checks }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          branches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' | grep -E '^(master|release-v.+)$')
          for branch in $branches; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$branch...$SHA" --jq .status || true)
            if [[ "$status" == "identical" || "$status" == "behind" ]]; then
              exit 0
            fi
          done
          echo "::error::$SHA is not on a release branch"
          exit 1

      - name: Wait for checks
        if: ${{ !inputs.skip_checks }}
        uses: apify/actions/wait-for-checks@v1.6.2
        with:
          ref: ${{ steps.sha.outputs.sha }}
          check-regexp: ^Checks

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: uv run poe install-dev

      - name: Install pnpm and website dependencies
        uses: apify/actions/pnpm-install@v1.6.2
        with:
          working-directory: website

      - name: Update docs theme
        run: uv run poe update-docs-theme

      - name: Upload the updated package.json and lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-theme-update
          path: |
            website/package.json
            website/pnpm-lock.yaml
          retention-days: 1

      - name: Build docs
        run: uv run poe build-docs
        env:
          APIFY_SIGNING_TOKEN: ${{ secrets.APIFY_SIGNING_TOKEN }}
          SEGMENT_TOKEN: ${{ secrets.SEGMENT_TOKEN }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./website/build

  # The service account token is only used in jobs that do not run the docs toolchain.
  commit_docs_theme:
    name: Commit docs theme update
    needs: [build_docs]
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Start from the commit the update was made on, so the pull below merges it with anything pushed since.
      - name: Reset to the built commit
        run: git reset --hard "$BUILT_SHA"
        env:
          BUILT_SHA: ${{ needs.build_docs.outputs.sha }}

      - name: Download the updated package.json and lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-theme-update
          path: website

      - name: Commit the updated package.json and lockfile
        uses: apify/actions/signed-commit@v1.6.2
        with:
          message: "chore: Automatic docs theme update [skip ci]"
          add: website/package.json website/pnpm-lock.yaml
          pull: --rebase --autostash
          github-token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

  deploy_docs:
    name: Deploy docs
    needs: [build_docs]
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Set up GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy artifact to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Invalidate CloudFront cache
        run: |
          gh workflow run invalidate-cloudfront.yml \
            --repo apify/apify-docs-private \
            --field deployment=apify-docs
          echo "✅ CloudFront cache invalidation workflow triggered successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
